name: Automated AI Sentiment Scraper

on:
  schedule:
    # Runs every 4 hours UTC
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser vaderSentiment supabase-py

      - name: Run Sentiment Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python src/sentiment_scraper/scraper.py