name: Automated AI Sentiment Scraper

on:
  schedule:
    # Runs every 4 hours UTC
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3 # Or latest v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Sentiment Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uv run python src/sentiment_scraper/scraper.py