[project]
name = "sentiment-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeffrey Siu", email = "jeffythecashless@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "feedparser>=6.0.14",
    "plotly[express]>=7.1.0",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "supabase>=2.33.0",
    "vadersentiment>=3.3.2",
]

[project.scripts]
sentiment-scraper = "sentiment_scraper:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
